services:
  db:
    image: postgres:15
    container_name: db
    volumes:
      - ./db:/var/lib/postgresql/data/
    restart: "unless-stopped"
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./frontend/.env
  app:
    image: nextjs
    env_file:
      - ./frontend/.env
    build:
      context: ./frontend
      dockerfile: ./Docker/Dockerfile
      target: deploy
      tags:
        - foodinventory_frontend:latest
    restart: "unless-stopped"
    ports:
      - "9004:9004"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public:/app/public
